services:
  app:
    container_name: app
    build: .
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    ports:
      - 7860:7860
      - 5678:5678
    volumes:  # overwrites dockerfile [change for prod]
      - .:/code
      # - hg_volume:/.cache/torch/sentence_transformers
    networks:
      - local_network

  chromadb:
    container_name: chromadb
    image: chromadb/chroma:1.0.16
    environment:
      - ANONYMIZED_TELEMETRY=False
    ports:
      - 8000:8000
    volumes:
      - ./data/chroma:/data
    networks:
      - local_network
  ollama:
    container_name: ollama
    image: ollama/ollama:0.11.4
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [compute, utility]
    # runtime: nvidia
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama
    networks:
      - local_network
      
networks:
  local_network:
    driver: bridge

volumes:
  ollama:
  # hg_volume: